<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap');

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --border: #2a2a30;
      --accent: #7cf0a0;
      --text: #e8e8ec;
      --muted: #6b6b78;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 56px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    a#download-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #0f0f11;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      transition: opacity 0.2s;
    }

    a#download-link:hover { opacity: 0.85; }

    .status {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .status span {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">⬇️</div>
    <h1>Bestand downloaden</h1>
    <p>De download start automatisch. Klik op de knop als dat niet het geval is.</p>

    <!--
      Verander 'jouw-bestand.zip' naar de bestandsnaam die je wilt downloaden.
      Het bestand moet ook in je GitHub Pages repo staan (of een externe URL zijn).
    -->
    <a id="download-link" href="jouw-bestand.zip" download>
      ↓ Download
    </a>

    <p class="status" id="status">Bezig met starten...</p>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const link = document.getElementById('download-link');
      const status = document.getElementById('status');

      // Automatisch klikken zodra de pagina geladen is
      link.click();

      status.innerHTML = 'Download gestart — <span>klaar</span>';
    });
  </script>

</body>
</html>
